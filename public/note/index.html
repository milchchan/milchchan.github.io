    <style media="screen">
:root {
  color-scheme: light;
  --background-color: var(--paper);
  --paper: #f7f7f4;
  --paper-glass: rgb(247 247 244 / 75%);
  --ink: rgb(38 37 30);
  --muted: #666960;
  --line: rgb(102 105 96 / 25%);
  --accent: #00e7ff;
  --active: #00e7ff;
  --notebook-sheen: rgba(0, 231, 255, 0.025);
  --control-ink: #666960;
  --control-hover: rgba(70, 78, 70, 0.075);
  --focus-ring: rgba(0, 231, 255, 0.25);
  --control-shadow: #0a0a0a1a;
  --editor-ink: #34372f;
  --placeholder: rgb(52 55 47 / 50%);
  --error: #ffee00;
  --preview-ink: #2c2f2a;
  --heading-ink: #2c2f2a;
  --strong-ink: #2c2f2a;
  --em-ink: #2c2f2a;
  --link-line: #00e7ff;
  --quote-ink: #666960;
  --quote-border: #ffc7e5;
  --code-border: #e4e0d7;
  --code-bg: #f2f0e9;
  --pre-border: #dfddd4;
  --pre-bg: #f1f0e9;
  --tooltip-ink: #fbfaf6;
  --tooltip-background: rgb(44 47 42 / 75%);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #14120b;
    --paper-glass: rgb(20, 18, 11 / 75%);
    --ink: rgb(237 236 236);
    --muted: #a8aca2;
    --line: rgb(168 172 162 / 25%);
    --accent: #00e7ff;
    --active: #00e7ff;
    --notebook-sheen: rgba(0, 231, 255, 0.025);
    --control-ink: #a8aca2;
    --control-hover: rgba(226, 235, 227, 0.075);
    --focus-ring: rgba(0, 231, 255, 0.25);
    --control-shadow: #0a0a0a1a;
    --editor-ink: #e3e5dc;
    --placeholder: rgb(52 55 47 / 50%);
    --error: #ffee00;
    --preview-ink: #e5e5dc;
    --heading-ink: #e5e5dc;
    --strong-ink: #e5e5dc;
    --em-ink: #e5e5dc;
    --link-line: #00e7ff;
    --quote-ink: #a8aca2;
    --quote-border: #ffc7e5;
    --code-border: #3a3e37;
    --code-bg: #20231f;
    --pre-border: #3b3f38;
    --pre-bg: #1d201c;
    --tooltip-ink: #171916;
    --tooltip-background: rgb(229 229 220 / 75%);
  }
}

* {
  box-sizing: border-box;
}

html {
  background: var(--paper);
}

body {
  min-width: 320px;
  min-height: 100vh;
  min-height: 100dvh;
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: "DM Sans", "Noto Sans JP", sans-serif;
  -webkit-font-smoothing: antialiased;
}

html,
body,
.notebook {
  transition: color 500ms ease, background-color 500ms ease;
}

button,
textarea {
  font: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.notebook {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(
    90deg,
    transparent 0,
    var(--notebook-sheen) 50%,
    transparent 100%
  );
}

.overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 16px;
  overflow: hidden;
  animation: overlay-fade 500ms ease-out both;
  backface-visibility: hidden;
  box-sizing: border-box;
  transition: opacity 500ms ease, padding 500ms ease;
}

.frame {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 16px;
  background: var(--paper);
  opacity: 1;
  transition: background-color 500ms ease, opacity 500ms ease;
}

.frame.is-file-dragging {
  opacity: 0.5;
}

.frame > .wrap {
  position: absolute;
  inset: 0 0 0 32px;
  width: auto;
  height: auto;
  box-sizing: border-box;
  transition: inset 500ms ease, padding 500ms ease;
}

.sidebar {
  position: fixed;
  z-index: 11;
  top: 16px;
  left: 0;
  width: 48px;
  height: calc(100% - 32px);
  background: transparent;
  transition:
    top 500ms ease,
    left 500ms ease,
    height 500ms ease,
    opacity 500ms ease;
  user-select: none;
}

.sidebar > .level {
  display: flex;
  width: 48px;
  height: 100%;
  margin: 0;
  padding: 0;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
}

.sidebar > .level > .level-item > .level {
  display: flex;
  margin: -16px;
  padding: 0;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
}

.sidebar > .level > .level-item > .level > .level-item {
  display: flex;
  margin: 0;
  padding: 16px;
}

.sidebar .level > .level-item {
  margin: 0;
  padding: 0;
}

.sidebar .rotation-outer {
  display: inline-flex;
}

.sidebar .rotation-inner {
  height: 0;
  padding: 50% 0;
}

.sidebar .rotate {
  display: block;
  margin-top: -50%;
  white-space: nowrap;
  transform: rotate(-90deg) translate(0, 100%) rotate(180deg);
  transform-origin: top left;
}

.sidebar .button {
  display: flex;
  width: fit-content;
  height: 48px;
  margin: 0;
  padding: 0;
  align-items: center;
  justify-content: center;
  color: var(--ink);
  border: 0;
  background: transparent;
  cursor: pointer;
  line-height: 18px;
  text-decoration: none;
  transition: color 500ms ease, opacity 500ms ease;
}

.milchchan-mark {
  outline: 0;
}

.milchchan-mark:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
}

.milchchan-mark-clip {
  position: relative;
  display: flex;
  height: 18px;
  overflow: hidden;
}

.milchchan-mark-scroll {
  position: relative;
  display: flex;
  margin: 0 -4px;
  align-items: center;
  transform: translate3d(0, 0, 0);
  transition: transform 500ms ease-in;
}

.milchchan-mark-scroll > span {
  display: flex;
  height: 18px;
  margin: 0 4px;
  align-items: center;
  font-family: "Barlow", sans-serif;
  font-size: 12px;
  font-weight: 700;
  line-height: 12px;
  text-transform: uppercase;
  white-space: nowrap;
}

.milchchan-mark-scroll > span:last-child {
  position: absolute;
  left: 100%;
}

.milchchan-mark:hover .milchchan-mark-scroll,
.milchchan-mark:focus-visible .milchchan-mark-scroll {
  transform: translate3d(-100%, 0, 0);
  transition-timing-function: ease-out;
}

@keyframes overlay-fade {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

@keyframes tooltip-ticker {
  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(var(--tooltip-distance, 0));
  }
}

.icon-controls {
  position: absolute;
  z-index: 10;
  top: 16px;
  right: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: top 500ms ease, right 500ms ease;
}

.icon-button {
  position: relative;
  display: grid;
  width: 38px;
  height: 38px;
  padding: 0;
  place-items: center;
  color: var(--control-ink);
  border: 0;
  border-radius: 11px;
  background: transparent;
  cursor: pointer;
  transition: color 500ms ease, background 500ms ease, transform 500ms ease, opacity 500ms ease;
}

.icon-button:not(:disabled):hover {
  color: var(--ink);
  background: var(--control-hover);
}

.icon-button:not(:disabled):active {
  transform: scale(0.96);
}

.icon-button:focus-visible {
  outline: 3px solid var(--focus-ring);
  outline-offset: 2px;
}

textarea:focus-visible,
.preview-pane:focus-visible {
  outline: 0;
}

.icon-button:disabled {
  cursor: not-allowed;
  opacity: 0.38;
}

.icon-button.is-busy {
  opacity: 1;
}

.tts-control,
.mode-control {
  border: 0;
  background: var(--paper-glass);
  box-shadow: 0 .5em 1em -.125em var(--control-shadow);
  -webkit-backdrop-filter: blur(16px);
  backdrop-filter: blur(16px);
  transition: background-color 500ms ease, border-color 500ms ease, box-shadow 500ms ease;
}

.tts-control {
  display: flex;
  width: 48px;
  height: 48px;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  transition:
    width 500ms ease,
    background-color 500ms ease,
    border-color 500ms ease,
    box-shadow 500ms ease;
}

.tts-control.has-reset {
  width: 90px;
}

.tts-control .icon-button {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

#tts-button {
  z-index: 1;
}

.tooltip {
  --tooltip-gap: 0.75rem;
  position: absolute;
  z-index: 20;
  top: calc(100% + 12px);
  right: auto;
  left: 50%;
  width: max-content;
  max-width: min(240px, calc(100vw - 32px));
  padding: 8px 12px;
  overflow: hidden;
  color: var(--tooltip-ink);
  border: 0px none transparent;
  border-radius: 290486px;
  background: var(--tooltip-background);
  box-shadow: 0 .5em 1em -.125em var(--control-shadow);
  font-family: "Barlow", sans-serif;
  font-size: 0.75rem;
  font-weight: 500;
  line-height: 0.75rem;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -4px);
  transition:
    opacity 500ms ease,
    transform 500ms ease,
    visibility 0s linear 500ms,
    background-color 500ms ease,
    border-color 500ms ease,
    color 500ms ease;
  visibility: hidden;
}

.tooltip-viewport {
  display: block;
  width: 100%;
  height: 1.3em;
  overflow: hidden;
  white-space: nowrap;
}

.tooltip-track {
  display: flex;
  width: max-content;
  min-width: 100%;
  flex-direction: row;
  align-items: center;
  gap: var(--tooltip-gap);
  transform: translateX(0);
}

.tooltip.is-ticker .tooltip-track {
  width: 100%;
  min-width: 0;
}

.tooltip-line {
  display: block;
  width: max-content;
  min-width: 0;
  min-height: 1.3em;
  flex: 0 0 auto;
  line-height: 1.3;
  white-space: nowrap;
}

.tooltip.is-ticker .tooltip-line {
  width: 100%;
  flex: 0 0 100%;
}

.tooltip.is-ticker .tooltip-track {
  animation: tooltip-ticker var(--tooltip-duration, 4s) linear infinite;
  animation-play-state: paused;
}

#tts-button.has-tooltip:hover .tooltip,
#tts-button.has-tooltip:focus-visible .tooltip {
  opacity: 1;
  transform: translate(-50%, 0);
  transition-delay: 0s;
  visibility: visible;
}

#tts-button.has-tooltip:hover .tooltip.is-ticker .tooltip-track,
#tts-button.has-tooltip:focus-visible .tooltip.is-ticker .tooltip-track {
  animation-play-state: running;
}

.mode-control {
  display: flex;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
}

.voice-reset-button {
  min-width: 0;
  overflow: hidden;
  transition:
    color 500ms ease,
    width 500ms ease,
    flex-basis 500ms ease,
    margin 500ms ease,
    padding 500ms ease,
    opacity 500ms ease,
    transform 500ms ease,
    background-color 500ms ease,
    box-shadow 500ms ease;
}

.voice-reset-button.is-hidden {
  flex-basis: 0;
  width: 0;
  margin-left: -2px;
  margin-right: 0;
  padding-right: 0;
  padding-left: 0;
  opacity: 0;
  pointer-events: none;
  transform: scale(0.76);
}

.voice-reset-button .fa-solid {
  font-size: 16px;
}

.spectral-analyzer {
  --spectral-dot-radius: 2px;
  --spectral-bar-count: 8;
  --spectral-height: 16px;
  --spectral-gap: 4px;
  position: absolute;
  z-index: 9;
  bottom: 0;
  left: 50%;
  display: block;
  width: calc(
    var(--spectral-dot-radius) * 2 * var(--spectral-bar-count) +
      var(--spectral-gap) * (var(--spectral-bar-count) - 1)
  );
  height: var(--spectral-height);
  pointer-events: none;
  transform: translateX(-50%);
}

.mode-button {
  border-radius: 50%;
}

.mode-button[aria-pressed="true"] {
  color: var(--accent);
}

.mode-button[aria-pressed="true"]:not(:disabled):hover {
  color: var(--accent);
}

.mode-button::before {
  position: absolute;
  bottom: 4px;
  left: 50%;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  content: "";
  opacity: 0;
  transform: translateX(-50%) scale(0.5);
  transition: opacity 500ms ease, transform 500ms ease, background-color 500ms ease;
}

.mode-button[aria-pressed="true"]::before {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

.icon-swap {
  position: relative;
  display: inline-block;
  width: 18px;
  height: 18px;
}

.icon-layer {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  opacity: 0;
  transform: scale(0.76);
  transition: opacity 500ms ease, transform 500ms ease;
}

#tts-button:not(.is-generating):not(.is-playing) .tts-play-layer,
#tts-button.is-generating .tts-pause-layer,
#tts-button.is-playing .tts-pause-layer,
.document-state:not(.is-saving):not(.has-error) .status-check-layer,
.document-state.is-saving:not(.has-error) .status-reload-layer,
.document-state.has-error .status-error-layer {
  opacity: 1;
  transform: scale(1);
}

.icon-layer .fa-solid {
  font-size: 16px;
  line-height: 1;
}

.tts-play-layer .fa-play {
  margin-left: 1px;
}

.mode-button .fa-solid {
  font-size: 16px;
}

.tts-reload-layer .fa-spin,
.status-reload-layer .fa-spin {
  --fa-animation-duration: 1000ms;
  animation-play-state: paused;
}

.document-state.is-saving .status-reload-layer .fa-spin {
  animation-play-state: running;
}

.editor-pane,
.preview-pane {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-height: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 500ms ease;
  will-change: opacity;
}

.editor-pane {
  z-index: 1;
  opacity: 1;
  pointer-events: auto;
}

.preview-pane {
  z-index: 2;
}

.is-previewing .editor-pane {
  opacity: 0;
  pointer-events: none;
}

.is-previewing .preview-pane {
  opacity: 1;
  pointer-events: auto;
}

textarea {
  display: block;
  width: 100%;
  height: 100%;
  min-height: 100%;
  resize: none;
  padding: 0;
  color: var(--editor-ink);
  border: 0;
  outline: 0;
  background: transparent;
  font-family: "Noto Sans JP", sans-serif;
  font-size: clamp(15px, 1.15vw, 17px);
  font-weight: 400;
  letter-spacing: 0.018em;
  line-height: 1.7;
  caret-color: var(--accent);
  transition: color 500ms ease, padding 500ms ease;
}

textarea::placeholder {
  color: var(--placeholder);
  transition: color 500ms ease;
}

.preview-pane {
  min-height: 100%;
  padding: 0;
  overflow-y: auto;
  transition: opacity 500ms ease, padding 500ms ease;
}

.status-bar {
  position: absolute;
  z-index: 8;
  right: 16px;
  bottom: 16px;
  left: 48px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  min-height: 48px;
  padding: 0;
  color: var(--muted);
  font-size: 0.75rem;
  line-height: 0.75rem;
  pointer-events: none;
  transition:
    right 500ms ease,
    bottom 500ms ease,
    left 500ms ease,
    padding 500ms ease,
    color 500ms ease,
    opacity 500ms ease;
}

.document-state {
  display: inline-flex;
  align-items: center;
  color: var(--accent);
  transition: color 500ms ease;
}

.document-state.has-error {
  color: var(--error);
}

.status-icon {
  width: 17px;
  height: 17px;
}

#word-count {
  font-family: "Barlow", sans-serif;
}

.markdown-body {
  color: var(--preview-ink);
  font-family: "Noto Sans JP", sans-serif;
  font-size: clamp(15px, 1.15vw, 17px);
  line-height: 1.95;
  overflow-wrap: anywhere;
  transition: color 500ms ease;
}

.markdown-body > :first-child {
  margin-top: 0;
}

.markdown-body > :last-child {
  margin-bottom: 0;
}

.markdown-body h1,
.markdown-body h2,
.markdown-body h3,
.markdown-body h4 {
  color: var(--heading-ink);
  font-family: "Noto Serif JP", serif;
  font-weight: 600;
  line-height: 1.48;
  transition: color 500ms ease, border-color 500ms ease;
}

.markdown-body h1 {
  margin: 0 0 1.2em;
  padding-bottom: 0.55em;
  border-bottom: 1px solid var(--line);
  font-size: clamp(26px, 3.3vw, 40px);
  letter-spacing: 0.015em;
}

.markdown-body h2 {
  margin: 2.15em 0 0.7em;
  font-size: clamp(21px, 2.2vw, 27px);
}

.markdown-body h3 {
  margin: 1.8em 0 0.55em;
  font-size: 19px;
}

.markdown-body h4 {
  margin: 1.6em 0 0.5em;
  font-size: 16px;
}

.markdown-body p {
  margin: 0 0 1.25em;
  transition: color 500ms ease;
}

.markdown-body strong {
  color: var(--strong-ink);
  font-weight: 700;
  transition: color 500ms ease;
}

.markdown-body em {
  color: var(--em-ink);
  transition: color 500ms ease;
}

.markdown-body a {
  color: var(--accent);
  opacity: 1;
  text-decoration-color: var(--link-line);
  text-underline-offset: 3px;
  transition: color 500ms ease, opacity 500ms ease, text-decoration-color 500ms ease;
}

.markdown-body a:hover {
  opacity: 0.5;
}

.markdown-body ul,
.markdown-body ol {
  margin: 0 0 1.35em;
  padding-left: 1.55em;
  transition: color 500ms ease;
}

.markdown-body li {
  margin: 0.38em 0;
  padding-left: 0.22em;
}

.markdown-body li::marker {
  color: var(--accent);
}

.markdown-body .task-list {
  padding-left: 0;
  list-style: none;
}

.markdown-body .task-item {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding-left: 0;
}

.markdown-body input[type="checkbox"] {
  width: 15px;
  height: 15px;
  margin: 7px 0 0;
  accent-color: var(--accent);
  pointer-events: none;
}

.markdown-body blockquote {
  margin: 1.7em 0;
  padding: 0.2em 0 0.2em 1.25em;
  color: var(--quote-ink);
  border-left: 3px solid var(--quote-border);
  font-family: "Noto Serif JP", serif;
  transition: color 500ms ease, border-color 500ms ease;
}

.markdown-body blockquote p {
  margin: 0.5em 0;
}

.markdown-body code {
  padding: 0.15em 0.42em;
  color: inherit;
  border: 1px solid var(--code-border);
  border-radius: 5px;
  background-color: var(--code-bg);
  font-family: "SFMono-Regular", Consolas, monospace;
  font-size: 0.88em;
  transition: background-color 500ms ease, border-color 500ms ease;
}

.markdown-body pre {
  overflow-x: auto;
  margin: 1.6em 0;
  padding: 20px 22px;
  border: 1px solid var(--pre-border);
  border-radius: 10px;
  background: var(--pre-bg);
  line-height: 1.65;
  transition: background-color 500ms ease, border-color 500ms ease, color 500ms ease;
}

.markdown-body pre code {
  padding: 0;
  border: 0;
  background: transparent;
  font-size: 13px;
}

.markdown-body hr {
  height: 1px;
  margin: 2.5em 0;
  border: 0;
  background: var(--line);
  transition: background-color 500ms ease;
}

.markdown-body > .is-tts-active,
.markdown-body > .is-tts-active :is(strong, em) {
  color: var(--active);
}

@media screen and (min-width: 769px) and (min-height: 769px) {
  html {
    background: var(--background-color);
  }

  .editor-pane,
  .preview-pane {
    max-width: 769px;
    margin-right: auto;
    margin-left: auto;
  }

  .icon-controls {
    top: 32px;
    right: 32px;
  }

  .status-bar {

    <script type="module">
const STORAGE_KEY = "note";

const TTS_ENDPOINT = "https://milchchan.com/api/generate";
const TTS_LANGUAGE = "ja";
const TTS_TEMPERATURE = 1.0;
const SPECTRAL_BAR_COUNT = Math.max(

  Number.parseInt(
    getComputedStyle(document.querySelector("#spectral-analyzer"))
      .getPropertyValue("--spectral-bar-count"),
    10,
  ) || 8,
);
const SPECTRAL_ATTACK_SMOOTHING = 0.15;
const SPECTRAL_DECAY_SMOOTHING = 0.05;
const SPECTRAL_DISPLAY_RISE_SPEED = 5;
const SPECTRAL_DISPLAY_FALL_SPEED = 5;
const SPECTRAL_MIN_FREQUENCY = 80;
const SPECTRAL_MAX_FREQUENCY = 8000;
const SPECTRAL_MIN_LOG_FREQUENCY = 20;
const SPECTRAL_MIN_DECIBELS = -100;
const SPECTRAL_MAX_DECIBELS = -20;
const SPECTRAL_LOG_CURVE_STRENGTH = 9;
const SPECTRAL_LEVEL_GAIN = 0.82;
const SPECTRAL_LEVEL_HEADROOM = 0.9;
const SPECTRAL_REST_THRESHOLD = 0.002;
const SPECTRAL_LOADING_MIN_SCALE = 0.75;
const SPECTRAL_LOADING_MAX_SCALE = 1;
const SPECTRAL_LOADING_FADE_OUT_MS = 250;
const SPECTRAL_LOADING_FADE_IN_MS = 500;
const SPECTRAL_LOADING_STEP_MS =
  SPECTRAL_LOADING_FADE_OUT_MS + SPECTRAL_LOADING_FADE_IN_MS;
const SPECTRAL_LOADING_PULSE_MS =
  SPECTRAL_LOADING_FADE_OUT_MS + SPECTRAL_LOADING_FADE_IN_MS;
const SPECTRAL_LOADING_ORDER = [
  ...Array.from({ length: SPECTRAL_BAR_COUNT }, (_, index) => index),
  ...Array.from({ length: SPECTRAL_BAR_COUNT - 2 }, (_, index) =>
    SPECTRAL_BAR_COUNT - 2 - index,
  ),
];
const SPECTRAL_LOADING_CYCLE_MS =
  SPECTRAL_LOADING_PULSE_MS +
  SPECTRAL_LOADING_STEP_MS * (SPECTRAL_LOADING_ORDER.length - 1);
const SPECTRAL_LOADING_RESET_MS = 500;
const SPECTRAL_RELEASE_MS = 500;
const NORMAL_VOICE_INDEX = 0;
const QUOTE_VOICE_INDEX = 1;
const REFERENCE_VOICE_URLS = [
  new URL("./sounds/merku.ja.wav", import.meta.url),
  new URL("./sounds/milch.ja.wav", import.meta.url),
];

const sampleNote = `# こんにちは！

それから、声のWAVファイルをノートにドラッグ＆ドロップすると、その声で読み上げられるよ。`;

const input = document.querySelector("#markdown-input");
const editorPane = document.querySelector("#editor-pane");
const previewPane = document.querySelector("#preview-pane");

const previewButton = document.querySelector("#preview-button");

const ttsButton = document.querySelector("#tts-button");
const ttsTooltip = document.querySelector("#tts-tooltip");
const ttsTooltipTrack = document.querySelector(".tooltip-track");

let previewing = false;
let saveTimer;
let isLocalStorageSaving = false;
let isVoiceSaving = false;
let voiceResetButtonRevision = 0;
let fileDragDepth = 0;
let ttsHandler = null;
let ttsState = "idle";
let ttsProgress = "";
let ttsRunId = 0;
let ttsAbortController = null;
let ttsStatusResetTimer;
let ttsPlaybackRequested = true;
let ttsPlaybackResume = null;
let ttsIsGeneratingAudio = false;
let activeAudioContext = null;
let activeAudioSource = null;
let activeAudioAnalyser = null;
let tooltipMeasureFrame = null;
let spectralFrequencyData = null;
let spectralBarDescriptors = [];
let spectralEnergy = 0;
let spectralSmoothedLevels = new Array(SPECTRAL_BAR_COUNT).fill(0);
let spectralDisplayedLevels = new Array(SPECTRAL_BAR_COUNT).fill(0);
let spectralVisualizerScales = new Array(SPECTRAL_BAR_COUNT).fill(1);
let spectralReleaseFromScales = new Array(SPECTRAL_BAR_COUNT).fill(1);
let spectralLoadingStartedAt = 0;
let spectralLoadingResetStartedAt = 0;
let spectralLoadingResetFromScales = new Array(SPECTRAL_BAR_COUNT).fill(1);
let spectralReleaseStartedAt = 0;
let spectralAnimationFrame = null;
let spectralLastTimestamp = null;
let activeTtsSegmentIndex = null;
const referenceVoiceCache = new Map();

function clamp(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function smoothTowards(current, target, smoothing, deltaTime) {
  const frameScale = Math.max(0, deltaTime * 60);
  const adjusted = 1 - ((1 - smoothing) ** frameScale);
  return current + (target - current) * adjusted;
}

function centerWeightedValue(index, count) {
  if (count <= 1) return 1;
  return 1 - Math.abs(index - (count - 1) * 0.5) / (count * 0.5);
}

function decibelsToLevel(decibels) {
  const normalized = (decibels - SPECTRAL_MIN_DECIBELS) /
    (SPECTRAL_MAX_DECIBELS - SPECTRAL_MIN_DECIBELS);
  const clamped = clamp(normalized, 0, 1);
  return Math.log1p(clamped * SPECTRAL_LOG_CURVE_STRENGTH) /
    Math.log1p(SPECTRAL_LOG_CURVE_STRENGTH);
}

function buildLogBarDescriptors(audioContext, analyser) {
  const frequencyBinCount = analyser.frequencyBinCount;
  const nyquist = audioContext.sampleRate / 2;
  const maxBin = frequencyBinCount - 1;
  const minDisplayFrequency = Math.max(0, Math.min(SPECTRAL_MIN_FREQUENCY, nyquist));
  const maxDisplayFrequency = Math.min(SPECTRAL_MAX_FREQUENCY, nyquist);
  const safeMaxDisplayFrequency = Math.max(minDisplayFrequency, maxDisplayFrequency);
  const minFrequency = Math.max(
    audioContext.sampleRate / analyser.fftSize,
    SPECTRAL_MIN_LOG_FREQUENCY,
    minDisplayFrequency,
  );
  const minLog = Math.log10(minFrequency);
  const maxLog = Math.log10(Math.max(minFrequency, safeMaxDisplayFrequency));
  const minDisplayBin = Math.max(
    0,
    Math.min(maxBin, Math.floor((minDisplayFrequency / nyquist) * frequencyBinCount)),
  );
  const maxDisplayBin = Math.max(
    minDisplayBin,
    Math.min(maxBin, Math.ceil((safeMaxDisplayFrequency / nyquist) * frequencyBinCount) - 1),
  );
  const binEdges = new Array(SPECTRAL_BAR_COUNT + 1);

  binEdges[0] = minDisplayBin;
  binEdges[SPECTRAL_BAR_COUNT] = maxDisplayBin + 1;

  for (let index = 1; index < SPECTRAL_BAR_COUNT; index += 1) {
    const ratio = index / SPECTRAL_BAR_COUNT;
    const frequency = 10 ** (minLog + (maxLog - minLog) * ratio);
    const proposedEdge = Math.floor((frequency / nyquist) * frequencyBinCount);
    const minAllowedEdge = binEdges[index - 1] + 1;
    const remainingEdges = SPECTRAL_BAR_COUNT - index;
    const maxAllowedEdge = maxDisplayBin + 1 - remainingEdges;
    binEdges[index] = Math.max(minAllowedEdge, Math.min(maxAllowedEdge, proposedEdge));
  }

  return Array.from({ length: SPECTRAL_BAR_COUNT }, (_, index) => ({
    startBin: binEdges[index],
    endBin: Math.max(binEdges[index], binEdges[index + 1] - 1),
  }));
}

function requestSpectralAnimation() {
  if (spectralAnimationFrame === null) {
    spectralAnimationFrame = window.requestAnimationFrame(renderSpectralAnalyzer);
  }
}

function sineEaseInOut(value) {
  const clamped = clamp(value, 0, 1);
  return 0.5 - 0.5 * Math.cos(Math.PI * clamped);
}

function loadingScaleForPhase(phaseTime) {
  if (phaseTime <= 0) return SPECTRAL_LOADING_MAX_SCALE;

  if (phaseTime < SPECTRAL_LOADING_FADE_OUT_MS) {
    const progress = sineEaseInOut(phaseTime / SPECTRAL_LOADING_FADE_OUT_MS);
    return SPECTRAL_LOADING_MAX_SCALE +
      (SPECTRAL_LOADING_MIN_SCALE - SPECTRAL_LOADING_MAX_SCALE) * progress;
  }

  if (phaseTime < SPECTRAL_LOADING_PULSE_MS) {
    const progress = sineEaseInOut(
      (phaseTime - SPECTRAL_LOADING_FADE_OUT_MS) / SPECTRAL_LOADING_FADE_IN_MS,
    );
    return SPECTRAL_LOADING_MIN_SCALE +
      (SPECTRAL_LOADING_MAX_SCALE - SPECTRAL_LOADING_MIN_SCALE) * progress;
  }

  return SPECTRAL_LOADING_MAX_SCALE;
}

function writeLoadingScales(target, timestamp) {
  const elapsed = Math.max(0, timestamp - spectralLoadingStartedAt);
  const cycleTime = elapsed % SPECTRAL_LOADING_CYCLE_MS;
  target.fill(SPECTRAL_LOADING_MAX_SCALE);

  for (let step = 0; step < SPECTRAL_LOADING_ORDER.length; step += 1) {
    const index = SPECTRAL_LOADING_ORDER[step];
    const phaseTime = cycleTime - step * SPECTRAL_LOADING_STEP_MS;
    target[index] = Math.min(target[index], loadingScaleForPhase(phaseTime));
  }
}

function writeLoadingResetScales(target, timestamp) {
  const progress = sineEaseInOut(
    (timestamp - spectralLoadingResetStartedAt) / SPECTRAL_LOADING_RESET_MS,
  );
  for (let index = 0; index < target.length; index += 1) {
    const scale = spectralLoadingResetFromScales[index] ?? 1;
    target[index] = scale + (1 - scale) * progress;
  }
}

function writeReleaseScales(target, timestamp) {
  const progress = sineEaseInOut((timestamp - spectralReleaseStartedAt) / SPECTRAL_RELEASE_MS);
  for (let index = 0; index < target.length; index += 1) {
    const scale = spectralReleaseFromScales[index] ?? 1;
    target[index] = scale + (1 - scale) * progress;
  }
}

function resizeSpectralCanvas() {
  const rect = spectralAnalyzer.getBoundingClientRect();
  const pixelRatio = window.devicePixelRatio || 1;
  const width = Math.max(1, Math.round(rect.width * pixelRatio));
  const height = Math.max(1, Math.round(rect.height * pixelRatio));

  if (spectralAnalyzer.width !== width || spectralAnalyzer.height !== height) {
    spectralAnalyzer.width = width;
    spectralAnalyzer.height = height;
  }

  requestSpectralAnimation();
}

function drawSpectralAnalyzer(
  timestamp,
  isAudioPlaying,
  isLoading,
  isLoadingResetting,
  isReleasing,
) {
  const rect = spectralAnalyzer.getBoundingClientRect();
  const width = rect.width;
  const height = rect.height;
  const pixelRatio = window.devicePixelRatio || 1;
  const styles = getComputedStyle(spectralAnalyzer);
  const dotRadius = Number.parseFloat(styles.getPropertyValue("--spectral-dot-radius")) || 2;
  const barWidth = dotRadius * 2;
  const gap = Number.parseFloat(styles.getPropertyValue("--spectral-gap")) || 4;
  const actualWidth = barWidth * SPECTRAL_BAR_COUNT + gap * (SPECTRAL_BAR_COUNT - 1);
  const startX = (width - actualWidth) * 0.5;
  const color = getComputedStyle(document.documentElement).getPropertyValue("--active").trim();

  spectralContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  spectralContext.clearRect(0, 0, width, height);
  spectralContext.fillStyle = color;

  if (isLoadingResetting) {
    writeLoadingResetScales(spectralVisualizerScales, timestamp);
  } else if (isLoading) {
    writeLoadingScales(spectralVisualizerScales, timestamp);
  } else if (isReleasing) {
    writeReleaseScales(spectralVisualizerScales, timestamp);
  } else {
    spectralVisualizerScales.fill(1);
  }

  for (let index = 0; index < SPECTRAL_BAR_COUNT; index += 1) {
    const centerBoost = centerWeightedValue(index, SPECTRAL_BAR_COUNT);
    const loadingResetProgress = isLoadingResetting
      ? sineEaseInOut(
          (timestamp - spectralLoadingResetStartedAt) / SPECTRAL_LOADING_RESET_MS,
        )
      : 0;
    const normalized = isAudioPlaying || isReleasing
      ? clamp(
          (spectralDisplayedLevels[index] * 0.9 + centerBoost * 0.02 + spectralEnergy * 0.01) *
            (1 - loadingResetProgress),
          0.03,
          SPECTRAL_LEVEL_HEADROOM,
        )
      : 0;
    const baseHeight = Math.max(
      barWidth,
      (normalized / SPECTRAL_LEVEL_HEADROOM) * height,
    );
    const scale = clamp(
      spectralVisualizerScales[index],
      SPECTRAL_LOADING_MIN_SCALE,
      SPECTRAL_LOADING_MAX_SCALE,
    );
    const drawWidth = barWidth * scale;
    const isScaledDown = scale < SPECTRAL_LOADING_MAX_SCALE - 0.001;
    const barHeight = isScaledDown ? drawWidth : Math.max(drawWidth, baseHeight);
    const x = startX + index * (barWidth + gap) + (barWidth - drawWidth) * 0.5;
    const y = (height - barHeight) * 0.5;
    const radius = Math.min(drawWidth, barHeight) * 0.5;

    spectralContext.beginPath();
    spectralContext.roundRect(x, y, drawWidth, barHeight, radius);
    spectralContext.fill();
  }
}

function renderSpectralAnalyzer(timestamp) {
  spectralAnimationFrame = null;
  const deltaTime = spectralLastTimestamp === null
    ? 0
    : Math.max(0, (timestamp - spectralLastTimestamp) / 1000);
  spectralLastTimestamp = timestamp;

  const isAudioPlaying = Boolean(
    ttsState === "playing" &&
    activeAudioContext?.state === "running" &&
    activeAudioAnalyser &&
    spectralFrequencyData
  );
  const isLoading = ttsState === "generating" || ttsIsGeneratingAudio;
  let isLoadingResetting = isLoading && spectralLoadingStartedAt === 0;

  if (
    isLoadingResetting &&
    timestamp - spectralLoadingResetStartedAt >= SPECTRAL_LOADING_RESET_MS
  ) {
    spectralLoadingStartedAt = timestamp;
    isLoadingResetting = false;
  }

  const isReleasing =
    isLoadingResetting ||
    (!isLoading && timestamp - spectralReleaseStartedAt < SPECTRAL_RELEASE_MS);
  const shouldAnalyzeAudio = isAudioPlaying && !isReleasing;

  if (shouldAnalyzeAudio) {
    activeAudioAnalyser.getFloatFrequencyData(spectralFrequencyData);
    let energyTotal = 0;
    let energyCount = 0;

    for (const value of spectralFrequencyData) {
      if (!Number.isFinite(value)) continue;
      energyTotal += decibelsToLevel(value);
      energyCount += 1;
    }

    const nextEnergy = energyCount ? energyTotal / energyCount : 0;
    const energySmoothing = nextEnergy > spectralEnergy
      ? SPECTRAL_ATTACK_SMOOTHING
      : SPECTRAL_DECAY_SMOOTHING;
    spectralEnergy = smoothTowards(spectralEnergy, nextEnergy, energySmoothing, deltaTime);

    for (let index = 0; index < SPECTRAL_BAR_COUNT; index += 1) {
      const descriptor = spectralBarDescriptors[index];
      let bucketTotal = 0;
      let bucketSquareTotal = 0;
      let bucketCount = 0;

      if (descriptor) {
        for (let bin = descriptor.startBin; bin <= descriptor.endBin; bin += 1) {
          const level = decibelsToLevel(spectralFrequencyData[bin] ?? SPECTRAL_MIN_DECIBELS);
          bucketTotal += level;
          bucketSquareTotal += level * level;
          bucketCount += 1;
        }
      }

      const average = bucketCount ? bucketTotal / bucketCount : 0;
      const rms = bucketCount ? Math.sqrt(bucketSquareTotal / bucketCount) : 0;
      const bucketLevel = average * 0.55 + rms * 0.45;
      const centerBias = centerWeightedValue(index, SPECTRAL_BAR_COUNT) * 0.006;
      const nextLevel = clamp(
        bucketLevel * SPECTRAL_LEVEL_GAIN + centerBias,
        0,
        SPECTRAL_LEVEL_HEADROOM,
      );
      const levelSmoothing = nextLevel > spectralSmoothedLevels[index]
        ? SPECTRAL_ATTACK_SMOOTHING
        : SPECTRAL_DECAY_SMOOTHING;
      spectralSmoothedLevels[index] = smoothTowards(
        spectralSmoothedLevels[index],
        nextLevel,
        levelSmoothing,
        deltaTime,
      );
    }
  } else {
    spectralEnergy = smoothTowards(spectralEnergy, 0, SPECTRAL_DECAY_SMOOTHING, deltaTime);
    spectralSmoothedLevels = spectralSmoothedLevels.map((level) =>
      smoothTowards(level, 0, SPECTRAL_DECAY_SMOOTHING, deltaTime),
    );
  }

  for (let index = 0; index < SPECTRAL_BAR_COUNT; index += 1) {
    const displaySpeed = spectralSmoothedLevels[index] > spectralDisplayedLevels[index]
      ? SPECTRAL_DISPLAY_RISE_SPEED
      : SPECTRAL_DISPLAY_FALL_SPEED;
    spectralDisplayedLevels[index] = clamp(
      spectralDisplayedLevels[index] +
        (spectralSmoothedLevels[index] - spectralDisplayedLevels[index]) *
        clamp(deltaTime * displaySpeed, 0, 1),
      0,
      SPECTRAL_LEVEL_HEADROOM,
    );
  }

  drawSpectralAnalyzer(
    timestamp,
    shouldAnalyzeAudio,
    isLoading && !isLoadingResetting,
    isLoadingResetting,
    isReleasing,
  );

  const shouldContinue = isLoading || isAudioPlaying || isReleasing ||
    spectralDisplayedLevels.some((level) => level > SPECTRAL_REST_THRESHOLD);

  if (shouldContinue) {
    requestSpectralAnimation();
  } else {
    spectralEnergy = 0;
    spectralSmoothedLevels.fill(0);
    spectralDisplayedLevels.fill(0);
    spectralVisualizerScales.fill(1);
    spectralLastTimestamp = null;
  }
}

function escapeHtml(value) {
  return value
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderInline(source) {
  const codeTokens = [];
  let text = source.replace(/`([^`]+)`/g, (_, code) => {
    const token = `\uE000${codeTokens.length}\uE001`;
    codeTokens.push(`<code>${escapeHtml(code)}</code>`);
    return token;
  });

  text = escapeHtml(text);
  text = text.replace(/\[([^\]]+)]\(([^)\s]+)\)/g, (_, label, url) => {
    const normalizedUrl = url.toLowerCase();
    const isSafe =
      normalizedUrl.startsWith("https://") ||
      normalizedUrl.startsWith("http://") ||
      normalizedUrl.startsWith("mailto:");
    return isSafe
      ? `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`
      : label;
  });
  text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/__([^_]+)__/g, "<strong>$1</strong>");
  text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
  text = text.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  text = text.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
  text = text.replace(/\uE000(\d+)\uE001/g, (_, index) => codeTokens[Number(index)]);

  return text;
}

function isBlockStart(line) {
  return (
    /^#{1,4}\s/.test(line) ||
    /^>\s?/.test(line) ||
    /^[-*+]\s+/.test(line) ||
    /^\d+\.\s+/.test(line) ||
    /^```/.test(line) ||
    /^\s*(---+|___+|\*\*\*+)\s*$/.test(line)
  );
}

function renderMarkdown(markdown) {
  const lines = markdown.replace(/\r\n?/g, "\n").split("\n");
  const html = [];

  for (let index = 0; index < lines.length; ) {
    const line = lines[index];

    if (!line.trim()) {
      index += 1;
      continue;
    }

    const fence = line.match(/^```\s*([\w-]*)\s*$/);
    if (fence) {
      const codeLines = [];
      index += 1;
      while (index < lines.length && !/^```\s*$/.test(lines[index])) {
        codeLines.push(lines[index]);
        index += 1;
      }
      if (index < lines.length) index += 1;
      const language = fence[1] ? ` class="language-${escapeHtml(fence[1])}"` : "";
      html.push(`<pre><code${language}>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
      continue;
    }

    const heading = line.match(/^(#{1,4})\s+(.+)$/);
    if (heading) {
      const level = heading[1].length;
      html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
      index += 1;
      continue;
    }

    if (/^\s*(---+|___+|\*\*\*+)\s*$/.test(line)) {
      html.push("<hr>");
      index += 1;
      continue;
    }

    if (/^>\s?/.test(line)) {
      const quoteLines = [];
      while (index < lines.length && /^>\s?/.test(lines[index])) {
        quoteLines.push(lines[index].replace(/^>\s?/, ""));
        index += 1;
      }
      html.push(`<blockquote><p>${quoteLines.map(renderInline).join("<br>")}</p></blockquote>`);
      continue;
    }

    if (/^[-*+]\s+/.test(line)) {
      const items = [];
      let hasTasks = false;
      while (index < lines.length && /^[-*+]\s+/.test(lines[index])) {
        const item = lines[index].replace(/^[-*+]\s+/, "");
        const task = item.match(/^\[([ xX])]\s*(.*)$/);
        if (task) {
          hasTasks = true;
          const checked = task[1].toLowerCase() === "x" ? " checked" : "";
          items.push(
            `<li class="task-item"><input type="checkbox" tabindex="-1" aria-disabled="true"${checked}><span>${renderInline(task[2])}</span></li>`,
          );
        } else {
          items.push(`<li>${renderInline(item)}</li>`);
        }
        index += 1;
      }
      html.push(`<ul${hasTasks ? ' class="task-list"' : ""}>${items.join("")}</ul>`);
      continue;
    }

    if (/^\d+\.\s+/.test(line)) {
      const items = [];
      while (index < lines.length && /^\d+\.\s+/.test(lines[index])) {
        items.push(`<li>${renderInline(lines[index].replace(/^\d+\.\s+/, ""))}</li>`);
        index += 1;
      }
      html.push(`<ol>${items.join("")}</ol>`);
      continue;
    }

    const paragraph = [line];
    index += 1;
    while (index < lines.length && lines[index].trim() && !isBlockStart(lines[index])) {
      paragraph.push(lines[index]);
      index += 1;
    }
    html.push(`<p>${paragraph.map(renderInline).join("<br>")}</p>`);
  }

  return html.join("\n");
}

function elementToSpeechText(element) {
  if (element.matches("ul, ol")) {
    return Array.from(element.querySelectorAll(":scope > li"))
      .map((item) => elementToSpeechText(item))
      .filter(Boolean)
      .join("。");
  }

  const clone = element.cloneNode(true);
  clone.querySelectorAll("br").forEach((lineBreak) => lineBreak.replaceWith("\n"));

  return clone.textContent
    .replace(/\s*\n+\s*/g, "。")
    .replace(/。{2,}/g, "。")
    .replace(/[ \t]+/g, " ")
    .trim();
}

function markdownToSpeechSegments(markdown) {
  const container = document.createElement("div");
  container.innerHTML = renderMarkdown(markdown);

  return Array.from(container.children)
    .map((element, previewIndex) => ({
      text: elementToSpeechText(element),
      voiceIndex: element.matches("blockquote")
        ? QUOTE_VOICE_INDEX
        : NORMAL_VOICE_INDEX,
      previewIndex,
    }))
    .filter((segment) => segment.text);
}

function setActiveTtsSegment(previewIndex) {
  activeTtsSegmentIndex = previewIndex;
  previewPane.querySelector(".is-tts-active")?.classList.remove("is-tts-active");

  if (previewIndex === null) return;
  previewPane.children[previewIndex]?.classList.add("is-tts-active");
}

function openVoiceDatabase() {
  if (!window.indexedDB) {
    return Promise.reject(new Error("IndexedDBを利用できません"));
  }

  return new Promise((resolve, reject) => {
    const request = window.indexedDB.open(
      VOICE_DATABASE_NAME,
      VOICE_DATABASE_VERSION,
    );

    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(VOICE_OBJECT_STORE)) {
        database.createObjectStore(VOICE_OBJECT_STORE);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("IndexedDBを開けませんでした"));
  });
}

async function saveVoiceBlobs(blobs, names) {
  const database = await openVoiceDatabase();

  try {
    await new Promise((resolve, reject) => {
      const transaction = database.transaction(VOICE_OBJECT_STORE, "readwrite");
      const rejectTransaction = () => reject(
        transaction.error || new Error("参照音声を保存できませんでした"),
      );

      transaction.oncomplete = resolve;
      transaction.onerror = rejectTransaction;
      transaction.onabort = rejectTransaction;
      const objectStore = transaction.objectStore(VOICE_OBJECT_STORE);
      objectStore.put(blobs, VOICE_RECORD_KEY);
      objectStore.put(names, VOICE_NAME_RECORD_KEY);
    });
  } finally {
    database.close();
  }
}

async function deleteStoredVoiceBlobs() {
  const database = await openVoiceDatabase();

  try {
    await new Promise((resolve, reject) => {
      const transaction = database.transaction(VOICE_OBJECT_STORE, "readwrite");
      const rejectTransaction = () => reject(
        transaction.error || new Error("参照音声を削除できませんでした"),
      );

      transaction.oncomplete = resolve;
      transaction.onerror = rejectTransaction;
      transaction.onabort = rejectTransaction;
      const objectStore = transaction.objectStore(VOICE_OBJECT_STORE);
      objectStore.delete(VOICE_RECORD_KEY);
      objectStore.delete(VOICE_NAME_RECORD_KEY);
    });
  } finally {
    database.close();
  }

  referenceVoiceCache.clear();
}

async function loadVoiceBlobs() {
  if (!window.indexedDB) return null;

  let database = null;

  try {
    database = await openVoiceDatabase();
    const value = await new Promise((resolve, reject) => {
      const transaction = database.transaction(VOICE_OBJECT_STORE, "readonly");
      const request = transaction.objectStore(VOICE_OBJECT_STORE).get(VOICE_RECORD_KEY);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("参照音声を読み込めませんでした"));
    });

    if (!Array.isArray(value)) return null;
    const blobs = value.filter((value) => value instanceof Blob);
    return blobs.length > 0 ? blobs : null;
  } catch (error) {
    console.warn("IndexedDBの参照音声を読み込めませんでした", error);
    return null;
  } finally {
    database?.close();
  }
}

async function loadVoiceNames() {
  if (!window.indexedDB) return null;

  let database = null;

  try {
    database = await openVoiceDatabase();
    const value = await new Promise((resolve, reject) => {
      const transaction = database.transaction(VOICE_OBJECT_STORE, "readonly");
      const request = transaction.objectStore(VOICE_OBJECT_STORE).get(VOICE_NAME_RECORD_KEY);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error || new Error("参照音声名を読み込めませんでした"));
    });

    if (!Array.isArray(value)) return null;
    const names = value.filter((value) => typeof value === "string" && value.length > 0);
    return names.length > 0 ? names : null;
  } catch (error) {
    console.warn("IndexedDBの参照音声名を読み込めませんでした", error);
    return null;
  } finally {
    database?.close();
  }
}

function selectStoredReferenceVoice(voiceIndex, blobs) {
  if (!Array.isArray(blobs) || blobs.length === 0) return null;
  if (blobs.length === 1) return blobs[0];

  const expectedParity = voiceIndex % 2;
  for (let index = blobs.length - 1; index >= 0; index -= 1) {
    if (index % 2 === expectedParity) return blobs[index];
  }

  return blobs[0];
}

function selectStoredReferenceVoiceName(voiceIndex, names) {
  if (!Array.isArray(names) || names.length === 0) return null;
  if (names.length === 1) return names[0];

  const expectedParity = voiceIndex % 2;
  for (let index = names.length - 1; index >= 0; index -= 1) {
    if (index % 2 === expectedParity) return names[index];
  }

  return names[0];
}

function getEffectiveVoiceNames(names) {
  if (!Array.isArray(names) || names.length <= 2) return names || [];

  return [
    selectStoredReferenceVoiceName(NORMAL_VOICE_INDEX, names),
    selectStoredReferenceVoiceName(QUOTE_VOICE_INDEX, names),
  ].filter(Boolean);
}

async function getReferenceVoice(voiceIndex, storedVoices) {
  const storedVoice = selectStoredReferenceVoice(voiceIndex, storedVoices);
  if (storedVoice) return storedVoice;

  if (!referenceVoiceCache.has(voiceIndex)) {
    const request = fetch(REFERENCE_VOICE_URLS[voiceIndex]).then(async (response) => {
      if (!response.ok) {
        throw new Error("参照音声を読み込めませんでした");
      }

      return response.blob();
    });

    referenceVoiceCache.set(voiceIndex, request);
  }

  try {
    return await referenceVoiceCache.get(voiceIndex);
  } catch (error) {
    referenceVoiceCache.delete(voiceIndex);
    throw error;
  }
}

function abortError() {
  return new DOMException("Aborted", "AbortError");
}

function throwIfAborted(signal) {
  if (signal.aborted) throw abortError();
}

async function synthesizeSegment(segment, signal, storedVoices) {
  const formData = new FormData();
  formData.append(
    "file",
    await getReferenceVoice(segment.voiceIndex, storedVoices),
    "prompt.wav",
  );
  throwIfAborted(signal);
  formData.append(
    "data",
    JSON.stringify({
      input: segment.text,
      language: TTS_LANGUAGE,
      temperature: TTS_TEMPERATURE,
    }),
  );

  const response = await fetch(TTS_ENDPOINT, {
    mode: "cors",
    method: "POST",
    body: formData,
    signal,
  });

  if (!response.ok) {
    throw new Error(`音声生成に失敗しました (${response.status})`);
  }

  return activeAudioContext.decodeAudioData(await response.arrayBuffer());
}

function beginSegmentSynthesis(segment, signal, storedVoices) {
  const request = { settled: false, promise: null };
  request.promise = synthesizeSegment(segment, signal, storedVoices)
    .then((buffer) => ({ buffer, error: null }))
    .catch((error) => ({ buffer: null, error }))
    .finally(() => {
      request.settled = true;
    });
  return request;
}

async function resolveSegmentSynthesis(request) {
  const result = await request.promise;
  if (result.error) throw result.error;
  return result.buffer;
}

async function resolveTtsGeneration(request) {
  ttsIsGeneratingAudio = true;
  requestSpectralAnimation();

  try {
    return await resolveSegmentSynthesis(request);
  } finally {
    ttsIsGeneratingAudio = false;
    requestSpectralAnimation();
  }
}

function waitForTtsPlayback(signal) {
  throwIfAborted(signal);
  if (ttsPlaybackRequested) return Promise.resolve();

  return new Promise((resolve, reject) => {
    const handleResume = () => {
      cleanup();
      resolve();
    };
    const handleAbort = () => {
      cleanup();
      reject(abortError());
    };
    const cleanup = () => {
      signal.removeEventListener("abort", handleAbort);
      if (ttsPlaybackResume === handleResume) ttsPlaybackResume = null;
    };

    ttsPlaybackResume = handleResume;
    signal.addEventListener("abort", handleAbort, { once: true });
  });
}

function allowTtsPlayback() {
  ttsPlaybackRequested = true;
  ttsPlaybackResume?.();
}

async function playAudioBuffer(audioBuffer, signal) {
  const source = activeAudioContext.createBufferSource();
  activeAudioSource = source;
  source.buffer = audioBuffer;
  source.connect(activeAudioAnalyser || activeAudioContext.destination);

  try {
    await new Promise((resolve, reject) => {
      const handleEnded = () => {
        signal.removeEventListener("abort", handleAbort);
        resolve();
      };
      const handleAbort = () => {
        source.removeEventListener("ended", handleEnded);
        try {
          source.stop();
        } catch {
          // すでに停止済みの場合は何もしません。
        }
        reject(abortError());
      };

      source.addEventListener("ended", handleEnded, { once: true });
      signal.addEventListener("abort", handleAbort, { once: true });
      source.start(0);
    });
  } finally {
    source.disconnect();
    if (activeAudioSource === source) activeAudioSource = null;
  }
}

function setTtsState(nextState, progress = ttsProgress) {
  const wasGenerating = ttsState === "generating";
  const wasPlaying = ttsState === "playing";

  if (nextState === "generating" && !wasGenerating) {
    spectralLoadingStartedAt = 0;
    spectralLoadingResetStartedAt = performance.now();
    spectralLoadingResetFromScales = spectralVisualizerScales.slice();
  } else if (
    (wasGenerating && nextState !== "generating") ||
    (wasPlaying && nextState !== "playing")
  ) {
    spectralReleaseStartedAt = performance.now();
    spectralReleaseFromScales = spectralVisualizerScales.slice();
  }

  ttsState = nextState;
  ttsProgress = progress;
  ttsButton.classList.toggle("is-generating", nextState === "generating");
  ttsButton.classList.toggle("is-playing", nextState === "playing");
  ttsButton.classList.toggle("is-busy", nextState === "generating");
  ttsButton.disabled = !ttsHandler;
  requestSpectralAnimation();

  if (nextState === "playing" || nextState === "generating") {
    ttsButton.setAttribute("aria-label", "一時停止");
  } else if (nextState === "paused") {
    ttsButton.setAttribute("aria-label", "再開");
  } else {
    ttsButton.setAttribute("aria-label", "読み上げ");
  }
}

async function synthesize(segments, signal) {
  if (segments.length === 0) {
    throw new Error("読み上げるテキストがありません");
  }

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;

  if (!AudioContextClass) {
    throw new Error("このブラウザは音声再生に対応していません");
  }

  const storedVoices = await loadVoiceBlobs();
  throwIfAborted(signal);

  if (activeAudioSource) {
    activeAudioSource.stop();
    activeAudioSource.disconnect();
    activeAudioSource = null;
  }

  if (activeAudioContext && activeAudioContext.state !== "closed") {
    await activeAudioContext.close();
  }

  activeAudioContext = new AudioContextClass();
  activeAudioAnalyser = activeAudioContext.createAnalyser();
  activeAudioAnalyser.fftSize = 512;
  activeAudioAnalyser.smoothingTimeConstant = 0.88;
  activeAudioAnalyser.minDecibels = SPECTRAL_MIN_DECIBELS;
  activeAudioAnalyser.maxDecibels = SPECTRAL_MAX_DECIBELS;
  activeAudioAnalyser.connect(activeAudioContext.destination);
  spectralFrequencyData = new Float32Array(activeAudioAnalyser.frequencyBinCount);
  spectralBarDescriptors = buildLogBarDescriptors(activeAudioContext, activeAudioAnalyser);
  spectralEnergy = 0;
  spectralSmoothedLevels.fill(0);
  spectralDisplayedLevels.fill(0);
  await activeAudioContext.resume();

  try {
    const firstProgress = `1/${segments.length}`;
    setTtsState("generating", firstProgress);
    let audioBuffer = await resolveTtsGeneration(
      beginSegmentSynthesis(segments[0], signal, storedVoices),
    );

    for (let index = 0; index < segments.length; index += 1) {
      throwIfAborted(signal);
      const progress = `${index + 1}/${segments.length}`;
      const nextIndex = index + 1;
      const nextRequest =
        nextIndex < segments.length
          ? beginSegmentSynthesis(segments[nextIndex], signal, storedVoices)
          : null;

      await waitForTtsPlayback(signal);
      throwIfAborted(signal);
      setTtsState("playing", progress);
      setActiveTtsSegment(segments[index].previewIndex);
      await playAudioBuffer(audioBuffer, signal);
      setActiveTtsSegment(null);

      if (nextRequest) {
        const nextProgress = `${nextIndex + 1}/${segments.length}`;

        if (!nextRequest.settled) {
          setTtsState("generating", nextProgress);
        }

        audioBuffer = await resolveTtsGeneration(nextRequest);
      }
    }
  } finally {
    setActiveTtsSegment(null);

    if (activeAudioSource) {
      activeAudioSource.disconnect();
      activeAudioSource = null;
    }

    if (activeAudioContext && activeAudioContext.state !== "closed") {
      await activeAudioContext.close();
    }

    activeAudioContext = null;
    activeAudioAnalyser = null;
    spectralFrequencyData = null;
    spectralBarDescriptors = [];
    requestSpectralAnimation();
  }
}

function cancelTtsForEdit() {
  if (ttsState === "idle") return;

  ttsRunId += 1;
  ttsAbortController?.abort();
  ttsAbortController = null;
  ttsPlaybackRequested = true;
  window.clearTimeout(ttsStatusResetTimer);

  if (activeAudioSource) {
    try {
      activeAudioSource.stop();
    } catch {
      // すでに停止済みの場合は何もしません。
    }
  }

  if (activeAudioContext && activeAudioContext.state !== "closed") {
    activeAudioContext.close();
  }

  activeAudioContext = null;
  activeAudioAnalyser = null;
  spectralFrequencyData = null;
  spectralBarDescriptors = [];
  requestSpectralAnimation();
  documentState.classList.remove("is-speaking", "has-error");
  setTtsState("idle", "");
}

function updateCount() {
  const count = Array.from(input.value).length;
  wordCount.textContent = String(count);
}

function updateTtsTooltip(names) {
  const normalizedNames = getEffectiveVoiceNames(Array.isArray(names)
    ? names.filter((name) => typeof name === "string" && name.length > 0)
    : []);

  if (tooltipMeasureFrame !== null) {
    window.cancelAnimationFrame(tooltipMeasureFrame);
    tooltipMeasureFrame = null;
  }

  ttsTooltipTrack.replaceChildren();
  ttsTooltip.classList.remove("is-ticker");
  ttsTooltip.style.removeProperty("width");
  ttsButton.classList.toggle("has-tooltip", normalizedNames.length > 0);
  ttsTooltip.setAttribute("aria-hidden", String(normalizedNames.length === 0));

  if (normalizedNames.length === 0) {
    ttsTooltip.removeAttribute("aria-label");
    ttsButton.removeAttribute("aria-describedby");
    ttsTooltip.style.removeProperty("--tooltip-distance");
    ttsTooltip.style.removeProperty("--tooltip-duration");
    ttsTooltip.style.removeProperty("width");
    return;
  }

  const createLine = (name) => {
    const line = document.createElement("span");
    line.className = "tooltip-line";
    line.textContent = name;
    return line;
  };

  normalizedNames.forEach((name) => ttsTooltipTrack.append(createLine(name)));

  if (normalizedNames.length > 1) {
    ttsTooltipTrack.append(createLine(normalizedNames[0]));
    const firstLine = ttsTooltipTrack.firstElementChild;
    const tooltipStyle = getComputedStyle(ttsTooltip);
    const horizontalPadding =
      Number.parseFloat(tooltipStyle.paddingLeft) +
      Number.parseFloat(tooltipStyle.paddingRight);
    const horizontalBorder =
      Number.parseFloat(tooltipStyle.borderLeftWidth) +
      Number.parseFloat(tooltipStyle.borderRightWidth);
    const firstNameWidth = firstLine.getBoundingClientRect().width +
      horizontalPadding + horizontalBorder;

    ttsTooltip.style.width = `${firstNameWidth}px`;
    ttsTooltip.classList.add("is-ticker");
    ttsTooltip.style.setProperty(
      "--tooltip-duration",
      `${Math.max(1, Math.floor(normalizedNames.reduce((x, y) => x + y.length, 0) / 2))}s`,
    );

    tooltipMeasureFrame = window.requestAnimationFrame(() => {
      const viewportWidth = ttsTooltipTrack.parentElement.getBoundingClientRect().width;
      const trackStyle = getComputedStyle(ttsTooltipTrack);
      const gap = Number.parseFloat(trackStyle.columnGap) || 0;
      const cycleDistance = (viewportWidth + gap) * normalizedNames.length;
      ttsTooltip.style.setProperty("--tooltip-distance", `-${cycleDistance}px`);
      tooltipMeasureFrame = null;
    });
  } else {
    ttsTooltip.style.removeProperty("--tooltip-distance");
    ttsTooltip.style.removeProperty("--tooltip-duration");
  }

  ttsTooltip.setAttribute("aria-label", normalizedNames.join(", "));
  ttsButton.setAttribute("aria-describedby", "tts-tooltip");
}

function updateVoiceResetButtonState() {

function saveNote() {

  documentState.classList.remove("has-error");

function setPreview(nextState) {
  previewing = nextState;

  if (previewing) {
    const markdown = input.value.trim();
    previewPane.innerHTML = markdown
      ? renderMarkdown(markdown)
      : "";
    setActiveTtsSegment(activeTtsSegmentIndex);
  }

  document.body.classList.toggle("is-previewing", previewing);
  editorPane.setAttribute("aria-hidden", String(previewing));
  previewPane.setAttribute("aria-hidden", String(!previewing));
  editorPane.inert = previewing;
  previewPane.inert = !previewing;
  editButton.setAttribute("aria-pressed", String(!previewing));
  previewButton.setAttribute("aria-pressed", String(previewing));

  window.requestAnimationFrame(() => {
    (previewing ? previewPane : input).focus({ preventScroll: true });
  });
}

function dataTransferHasType(dataTransfer, type) {
  return Array.from(dataTransfer?.types || []).includes(type);
}

function isTextFile(file) {
  return file.type.startsWith("text/") ||
    /\.(?:md|markdown|mdown|mkd|txt)$/i.test(file.name);
}

function isReferenceVoiceFile(file) {
  return file.type === "audio/wav" ||
    file.type === "audio/x-wav" ||
    file.type === "audio/wave" ||
    /\.wav$/i.test(file.name);
}

async function setDroppedReferenceVoices(files) {
  const blobs = files.map((file) => new Blob([file], {
    type: file.type || "audio/wav",
  }));
  const names = files.map((file) => file.name);
  documentState.classList.remove("has-error");
  isVoiceSaving = true;
  updateSavingState();

  try {
    await saveVoiceBlobs(blobs, names);
    referenceVoiceCache.clear();
    setVoiceResetButtonVisible(true);
    updateTtsTooltip(names);
  } catch (error) {
    documentState.classList.add("has-error");
    throw error;
  } finally {
    isVoiceSaving = false;
    updateSavingState();
  }
}

async function resetReferenceVoices() {
  if (isVoiceSaving) return;

  cancelTtsForEdit();
  documentState.classList.remove("has-error");
  isVoiceSaving = true;
  updateSavingState();

  try {
    await deleteStoredVoiceBlobs();
    setVoiceResetButtonVisible(false);
    updateTtsTooltip([]);
  } catch (error) {
    documentState.classList.add("has-error");
    console.error(error);
  } finally {
    isVoiceSaving = false;
    updateSavingState();
  }
}

function resetFileDragState() {
  fileDragDepth = 0;
  dropFrame.classList.remove("is-file-dragging");
}

function appendDroppedText(text) {
  const normalizedText = text.replace(/\r\n?/g, "\n");
  if (!normalizedText) return;

  const needsSeparator = input.value &&
    !input.value.endsWith("\n") &&
    !normalizedText.startsWith("\n");
  input.value += `${needsSeparator ? "\n" : ""}${normalizedText}`;
  input.dispatchEvent(new Event("input", { bubbles: true }));

  if (previewing) {
    setPreview(true);
  } else {
    input.setSelectionRange(input.value.length, input.value.length);
    input.focus({ preventScroll: true });
    input.scrollTop = input.scrollHeight;
  }
}

dropFrame.addEventListener("dragenter", (event) => {
  if (!dataTransferHasType(event.dataTransfer, "Files")) return;
  event.preventDefault();
  fileDragDepth += 1;
  dropFrame.classList.add("is-file-dragging");
});

dropFrame.addEventListener("dragover", (event) => {
  const acceptsDrop = dataTransferHasType(event.dataTransfer, "Files") ||
    dataTransferHasType(event.dataTransfer, "text/plain");
  if (!acceptsDrop) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "copy";
});

dropFrame.addEventListener("dragleave", () => {
  if (fileDragDepth === 0) return;
  fileDragDepth -= 1;
  if (fileDragDepth === 0) resetFileDragState();
});

dropFrame.addEventListener("drop", async (event) => {
  const files = Array.from(event.dataTransfer?.files || []);
  const droppedText = event.dataTransfer?.getData("text/plain") || "";
  const acceptsDrop = files.length > 0 || droppedText;
  if (!acceptsDrop) return;

  event.preventDefault();
  resetFileDragState();

  if (files.length > 0) {
    const referenceVoiceFiles = files.filter(isReferenceVoiceFile);
    const textFiles = files.filter(isTextFile);

    if (referenceVoiceFiles.length === 0 && textFiles.length === 0) {
      documentState.classList.add("has-error");
      window.setTimeout(() => {
        documentState.classList.remove("has-error");
      }, 2600);
      return;
    }

    if (referenceVoiceFiles.length > 0) {
      cancelTtsForEdit();
      try {
        await setDroppedReferenceVoices(referenceVoiceFiles);
      } catch {
        if (textFiles.length === 0) return;
      }
    }

    if (textFiles.length === 0) return;

    try {
      const fileContents = await Promise.all(textFiles.map((file) => file.text()));
      appendDroppedText(fileContents.filter(Boolean).join("\n\n"));
    } catch {
      documentState.classList.add("has-error");
    }
    return;
  }

  appendDroppedText(droppedText);
});

document.addEventListener("dragend", resetFileDragState);
window.addEventListener("blur", resetFileDragState);

input.addEventListener("input", () => {
  cancelTtsForEdit();
  updateCount();
  queueSave();
});

input.addEventListener("keydown", (event) => {
  if (event.key === "Tab") {
    event.preventDefault();
    const start = input.selectionStart;
    const end = input.selectionEnd;
    input.setRangeText("  ", start, end, "end");
    input.dispatchEvent(new Event("input"));
  }
});

editButton.addEventListener("click", () => setPreview(false));
previewButton.addEventListener("click", () => setPreview(true));
voiceResetButton.addEventListener("click", resetReferenceVoices);

document.addEventListener("keydown", (event) => {
  if ((event.metaKey || event.ctrlKey) && event.key === "Enter") {
    event.preventDefault();
    setPreview(!previewing);
  }
  if (event.key === "Escape" && previewing) {
    setPreview(false);
  }
});

window.addEventListener("beforeunload", saveNoteSilently);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveNoteSilently();
});

async function runTtsFromStart() {
  if (!ttsHandler) return;
  const runId = ++ttsRunId;
  const abortController = new AbortController();

  ttsAbortController = abortController;
  ttsPlaybackRequested = true;
  ttsPlaybackResume = null;
  window.clearTimeout(ttsStatusResetTimer);
  setTtsState("generating", "");
  documentState.classList.add("is-speaking");

  try {
    const segments = markdownToSpeechSegments(input.value);
    await ttsHandler({
      markdown: input.value,
      text: segments.map((segment) => segment.text).join("\n"),
      segments,
      signal: abortController.signal,
    });
  } catch (error) {
    if (error.name === "AbortError" || runId !== ttsRunId) return;
    console.error(error);
    documentState.classList.add("has-error");
  } finally {
    if (runId !== ttsRunId) return;

    ttsAbortController = null;
    ttsPlaybackRequested = true;
    ttsPlaybackResume = null;
    setTtsState("idle", "");
    documentState.classList.remove("is-speaking");

    ttsStatusResetTimer = window.setTimeout(() => {
      documentState.classList.remove("has-error");
    }, 2600);
  }
}

ttsButton.addEventListener("click", async () => {
  if (!ttsHandler) return;

  if (ttsState === "generating") {
    ttsPlaybackRequested = false;
    setTtsState("paused");
    return;
  }

  if (ttsState === "playing") {
    ttsPlaybackRequested = false;
    await activeAudioContext?.suspend();
    if (ttsState === "playing") {
      setTtsState("paused");
    }
    return;
  }

  if (ttsState === "paused") {
    allowTtsPlayback();

    if (activeAudioSource) {
      await activeAudioContext?.resume();
      setTtsState("playing");
    } else if (ttsIsGeneratingAudio) {
      setTtsState("generating");
    }
    return;
  }

  await runTtsFromStart();
});

// 将来のTTS APIは window.notebook.connectTTS(handler) で接続できます。
window.notebook = {
  getMarkdown: () => input.value,
  connectTTS(handler) {
    if (typeof handler !== "function") return;
    ttsHandler = handler;
    setTtsState("idle", "");
  },
};

window.notebook.connectTTS(({ segments, signal }) => synthesize(segments, signal));

resizeSpectralCanvas();
window.addEventListener("resize", resizeSpectralCanvas);
window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.(
  "change",
  requestSpectralAnimation,
);

window.addEventListener("pagehide", () => {
  ttsAbortController?.abort();
  if (activeAudioSource) activeAudioSource.stop();
  if (activeAudioContext && activeAudioContext.state !== "closed") activeAudioContext.close();
  if (spectralAnimationFrame !== null) window.cancelAnimationFrame(spectralAnimationFrame);
});

let savedNote = null;
try {
  savedNote = localStorage.getItem(STORAGE_KEY);
} catch {
  documentState.classList.add("has-error");
}

input.value = savedNote === null ? sampleNote : savedNote;
updateCount();
initializeVoiceResetButton();
    </script>
  </body>
</html>
